name: 🚀 Create Release

on:
  push:
    tags:
      - 'v*'
      - 'V*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: '📌 Tag name (e.g., v4.0.0)'
        required: true
        type: string
      prerelease:
        description: '🔬 Prerelease'
        required: false
        type: boolean
        default: false

jobs:
  build-release:
    name: 🏗️ Build Release for ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: SecurePassPro-Linux
            asset_name: SecurePassPro-Linux
            content_type: application/x-executable
          - os: windows-latest
            artifact_name: SecurePassPro-Windows.exe
            asset_name: SecurePassPro-Windows.exe
            content_type: application/vnd.microsoft.portable-executable
          - os: macos-latest
            artifact_name: SecurePassPro-macOS
            asset_name: SecurePassPro-macOS
            content_type: application/x-mach-binary

    steps:
    - name: 📥 Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: 🐍 Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: 🔧 Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyinstaller
        pip install pillow customtkinter cryptography argon2-cffi qrcode[pil] requests psutil

    - name: 📍 Get version from tag
      id: get_version
      run: |
        if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
          VERSION="${{ github.event.inputs.tag_name }}"
        else
          VERSION="${GITHUB_REF#refs/tags/}"
        fi
        echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
        echo "tag=${VERSION}" >> $GITHUB_OUTPUT
      shell: bash

    - name: 📝 Update version in code
      run: |
        VERSION="${{ steps.get_version.outputs.version }}"
        if [ -f "utils/updater.py" ]; then
          sed -i "s/CURRENT_VERSION = \".*\"/CURRENT_VERSION = \"$VERSION\"/" utils/updater.py
        fi
        echo "Version updated to: $VERSION"
      shell: bash

    - name: 🏗️ Build with PyInstaller
      run: python build.py

    - name: 🔐 Generate SHA256 hash
      run: |
        cd dist
        if [ "${{ runner.os }}" = "Windows" ]; then
          certutil -hashfile ${{ matrix.artifact_name }} SHA256 > ${{ matrix.artifact_name }}.sha256
        else
          shasum -a 256 ${{ matrix.artifact_name }} > ${{ matrix.artifact_name }}.sha256
        fi
      shell: bash

    - name: 📦 Upload to release
      uses: softprops/action-gh-release@v1
      with:
        tag_name: ${{ steps.get_version.outputs.tag }}
        name: Secure Pass Pro v${{ steps.get_version.outputs.version }}
        body: |
          ## 🔐 Secure Pass Pro v${{ steps.get_version.outputs.version }}
          
          ### ✨ What's New
          - Please add release notes here
          
          ### 📥 Downloads
          | Platform | File | SHA256 |
          |----------|------|--------|
          | Windows | `SecurePassPro-Windows.exe` | [Download] |
          | Linux | `SecurePassPro-Linux` | [Download] |
          | macOS | `SecurePassPro-macOS` | [Download] |
          
          ### 🔒 Verification
          SHA256 checksums are provided for each file.
          
          ### 📖 Documentation
          [Wiki](https://github.com/${{ github.repository }}/wiki)
        files: |
          dist/*
        draft: false
        prerelease: ${{ github.event.inputs.prerelease || false }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}